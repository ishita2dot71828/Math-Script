plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mathscript.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.mathscript.app"
        minSdk 23
        targetSdk 34
        def runNumber = System.getenv("GITHUB_RUN_NUMBER")?.toInteger() ?: 15
        versionCode 15 + runNumber
        versionName "1.5.${runNumber}"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
